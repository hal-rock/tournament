[project]
name = "tournament"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "matplotlib>=3.10",
    "numpy>=2.0",
    "pyyaml>=6.0.3",
    "torch>=2.14.0",
    "transformers>=5.17.0",
    "wandb>=0.30.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]
# GPU pods only: flash-linear-attention kernels for Qwen 3.5's linear-attention layers;
# kernels keeps DeepSeek V4's FP8/FP4 weights quantized (range transformers 5.17 accepts).
gpu = [
    "flash-linear-attention>=0.5.2",
    "kernels>=0.16,<0.17",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
