# OLMo 3.1 32B Think: does the bleedthrough the 3.1 Instruct shows hold for the Think
# model? Its SFT is the one the Instruct SFT starts from, and in ../coinflip's standard
# task pairs it shows no Assistant effect where the Instruct does.
# Same 300 tasks and 15k pairs as the model sweep (configs/models/), so base and
# Instruct come from d8ysbybo refit on these pairs (models.olmo_on_shared_pairs).
# The template opens every reply with "<think>" and has no non-thinking mode, so the
# Assistant choice is read two ways (the coinflip is a Human turn, unaffected):
# - think: "<think></think>\nI'll choose Task", an empty block, as the hybrid-thinking
#   models in the sweep get (off-distribution for a Think-only model);
# - think-inreasoning: "<think>I'll choose Task", the first words of its reasoning.
# 1x H200 (64 GB in bf16), ~70 GB of disk.
wandb_project: tournament
group: think
run_name: olmo3.1-32b-think
tasks_file: data/tasks_n300_max500_seed0.jsonl
seed: 0
require_gpu: true
system_prompt: none
max_pairs: 15000
batch_size: 32
top_k_tokens: 5
progress_every: 2000
# Tolerance on the median |log-odds diff| between batched and unbatched scoring:
# bf16 rounding differs by batch shape (median ~0.1 nats), while a padding/masking
# bug shifts most prompts by several nats or gives NaN (see tournament.check_batching).
batching_check: {n_prompts: 16, tolerance: 0.5}

models:
  - name: allenai/Olmo-3.1-32B-Think
    stage: think
    close_think: true
    conditions: [assistant, coinflip]
    # How it phrases a choice after the empty think block, unprefilled.
    phrasing_probe: {n_pairs: 20, n_samples: 3, max_new_tokens: 12}
  - name: allenai/Olmo-3.1-32B-Think
    stage: think-inreasoning
    conditions: [assistant]
    phrasing_probe: {n_pairs: 20, n_samples: 3, max_new_tokens: 24}
