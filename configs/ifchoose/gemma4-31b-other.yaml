# Shallow instructions, reworded (README, "Shallow instructions, reworded: 'if I ask you to choose between tasks in this message'"):
# the user's message opens with "If I ask you to choose between tasks in this message, choose <rule>." (prompts.IFCHOOSE_RULES), then
# the usual prompt. The Assistant's choice and the coinflip under each rule, final model only; every pod also re-scores the
# plain coinflip as its own check against the sweep.
# 1x H200, as in the sweep (jrl62npf) and the roleplay runs; Gemma-it bf16 outputs shift with GPU type. ~100 GB of disk.
wandb_project: tournament
group: ifchoose
tags: [gemma4-31b]
run_name: ifchoose-gemma4-31b-other
tasks_file: data/tasks_n300_max500_seed0.jsonl
seed: 0
require_gpu: true
system_prompt: none
# The fixed 15,000 pairs of the model sweep.
max_pairs: 15000
batch_size: 32
top_k_tokens: 5
progress_every: 2000
batching_check: {n_prompts: 16, tolerance: 0.5}

models:
  - name: google/gemma-4-31B-it
    stage: instruct
    conditions: [coinflip_ifchoose_alpha, assistant_ifchoose_alpha, coinflip_ifchoose_invert, assistant_ifchoose_invert, coinflip]
