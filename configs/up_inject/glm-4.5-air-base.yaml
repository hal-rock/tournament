# Pushing the heads/tails lean (README, "Pushing the heads/tails lean at ' up' and around it"): the base of glm-4.5-air.
# The preference report (coin_report_bold), the 1,000 pilot pairs; pushes of the model's own lens heads - tails lean
# at the seven tokens below, at every block from the final's onset (block 23), +/- 1 nat, three random
# directions, and the final's own lean transplanted (configs/up_inject/transplant_glm-4.5-air.json).
family: glm-4.5-air-base
run_name: up-inject-glm-4.5-air-base
tags: [glm-4.5-air-base, up_inject]
tasks_file: data/tasks_n300_max500_seed0.jsonl
pairs: pilot
n_pairs: 1000
seed: 0
batch_size: 16
chunk_pairs: 64
model:
  name: zai-org/GLM-4.5-Air-Base
  chat_template_from: zai-org/GLM-4.5-Air
  max_memory: {0: 70GiB, 1: 70GiB, 2: 67GiB}  # as the final (loads at 69/69/72 ran out of memory on GPU 2)
report: coin_report_bold
arm_sets: [inject]
inject:
  tokens: [",", " the", " ...", " it", " came", " up", "."]
  onset: 23
  dose: 1.0
  seeds: [0, 1, 2]
  transplant: configs/up_inject/transplant_glm-4.5-air.json
