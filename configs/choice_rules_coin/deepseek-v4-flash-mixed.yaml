# Choice rules, the coinflip (README, "Choice rules: the coinflip"; Hal, 2026-11-25): the mixed rules in the user turn, for
# the Assistant's choice and the coinflip, with the no-rule layout and the plain prompts as each run's own baselines.
# Benign tasks only (257), the sweep's pairs among them (11,065), both orders. Tickets and languages:
# data/choice_rules_assign.json.
# 2x H200 in HF with the released FP8 / FP4-expert weights, as in the pilot (needs the gpu group). Same-length batches
# only (exact_length_batches): V4's output depends on padding, and its coin is small (sweep pair effects SD 0.73 nats,
# the scale of the padding noise). progress_every above the prompts per condition, so each condition is batched whole.
# Batching tolerance 1.0 as in the pilot (its log-odds come in 0.125-0.25-nat steps; with no padding only batch size
# can differ). The system form of the turn format is unused here (user-turn rules only).
wandb_project: tournament
group: choice_rules_coin
tags: [deepseek-v4-flash, mixed]
run_name: choice-rules-coin-deepseek-v4-flash-mixed
tasks_file: data/tasks_n300_max500_seed0.jsonl
choice_rules: true
benign_only: true
seed: 0
require_gpu: true
system_prompt: none
# The sweep's 15,000 pairs, restricted to pairs of two benign tasks.
max_pairs: 15000
batch_size: 32
top_k_tokens: 5
progress_every: 30000
exact_length_batches: true
batching_check: {n_prompts: 16, tolerance: 1.0}

models:
  - name: deepseek-ai/DeepSeek-V4-Flash
    stage: instruct
    turn_format: {user: "<｜begin▁of▁sentence｜><｜User｜>", reply: "<｜Assistant｜></think>",
                  system: "<｜begin▁of▁sentence｜>{system}<｜User｜>"}
    conditions: [assistant, coinflip, assistant_mixed, coinflip_mixed, assistant_mixed_spanish_user, assistant_mixed_english_user, coinflip_mixed_spanish_user, coinflip_mixed_english_user]
