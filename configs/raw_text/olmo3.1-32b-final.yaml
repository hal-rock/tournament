# Raw text (README, "The coinflip as raw text"): the coinflip prompt as a bare document, no chat template,
# in its own first-person words (with and without "Okay, ") and as ../coinflip's two third-person stories.
# One config per stage, each on its own pod. 1x A100 SXM, as the sweep used for OLMo. ~120 GB of disk.
wandb_project: tournament
group: raw_text
tags: [olmo3.1-32b]
run_name: raw-text-olmo3.1-32b-final
tasks_file: data/tasks_n300_max500_seed0.jsonl
seed: 0
require_gpu: true
system_prompt: none
# The fixed 15,000 pairs of the model sweep, so the Assistant and chat coinflip utilities can come from it.
max_pairs: 15000
batch_size: 32
top_k_tokens: 5
progress_every: 2000
batching_check: {n_prompts: 16, tolerance: 1.0}

models:
  - name: allenai/Olmo-3.1-32B-Instruct
    stage: instruct
    # OLMo's document separator (its EOS); the tokenizer adds no BOS to raw text.
    doc_prefix: "<|endoftext|>"
    conditions: [raw_okay, raw_no_okay, raw_story_ai, raw_story_person]
