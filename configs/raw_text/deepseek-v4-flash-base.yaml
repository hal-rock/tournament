# Raw text (README, "The coinflip as raw text"): the coinflip prompt as a bare document, no chat template,
# in its own first-person words (with and without "Okay, ") and as ../coinflip's two third-person stories.
# One config per stage, each on its own pod. 4x H200, as the sweep; weights stay FP8/FP4 (uv group gpu, kernels). ~460 GB of disk.
wandb_project: tournament
group: raw_text
tags: [deepseek-v4-flash]
run_name: raw-text-deepseek-v4-flash-base
tasks_file: data/tasks_n300_max500_seed0.jsonl
seed: 0
require_gpu: true
system_prompt: none
# The fixed 15,000 pairs of the model sweep, so the Assistant and chat coinflip utilities can come from it.
max_pairs: 15000
batch_size: 32
top_k_tokens: 5
progress_every: 2000
batching_check: {n_prompts: 16, tolerance: 0.5}

models:
  - name: deepseek-ai/DeepSeek-V4-Flash-Base
    stage: base
    # DeepSeek's BOS, as its turn format opens.
    doc_prefix: "<｜begin▁of▁sentence｜>"
    conditions: [raw_okay, raw_no_okay, raw_story_ai, raw_story_person]
