# Personas in the system prompt (README, "Personas in the system prompt"): the Assistant's choice and the coinflip with
# Gilg et al.'s evil and slacker personas, and a "You are a helpful assistant." control, as the system message. Final
# models only. Each model's conditions are split over two pods (a and b) for wall-clock time; together they cover
# assistant@{helpful,evil,slacker}, coinflip@{helpful,evil,slacker} and the plain coinflip, re-scored as a check
# against the sweep. 1x H200 without a KV cache, as in configs/openers/llama-70b.yaml (reproduced the sweep at r = 1.0000). ~150 GB of disk.
wandb_project: tournament
group: personas
tags: [llama-70b]
run_name: personas-llama-70b-b
tasks_file: data/tasks_n300_max500_seed0.jsonl
seed: 0
require_gpu: true
system_prompt: none  # the persona conditions set their own
# The fixed 15,000 pairs of the model sweep, so the no-system-prompt Assistant utilities can come from it.
max_pairs: 15000
batch_size: 32
top_k_tokens: 5
progress_every: 2000
batching_check: {n_prompts: 16, tolerance: 0.5}

models:
  - name: unsloth/Llama-3.3-70B-Instruct
    stage: instruct
    max_memory: {0: 139GiB}
    use_cache: false
    conditions: [coinflip@slacker, assistant@slacker, coinflip]
