# Persona placement (README, "Persona placement"): the evil persona at the start of the user turn, as the same
# second-person text ("/user") or in the first person, the user describing themselves ("/self"), next to the system
# prompt of the persona runs. Each model: two final pods (a, b) and one base pod. 1x H100 SXM (no H200 in stock on 2026-11-04; the same Hopper die), ~100 GB of disk. Every pod re-scores the
# plain coinflip as its own check against the sweep.
wandb_project: tournament
group: persona_placement
tags: [gemma4-31b]
run_name: persona-placement-gemma4-31b-final-a
tasks_file: data/tasks_n300_max500_seed0.jsonl
seed: 0
require_gpu: true
system_prompt: none
# The fixed 15,000 pairs of the model sweep.
max_pairs: 15000
batch_size: 32
top_k_tokens: 5
progress_every: 2000
batching_check: {n_prompts: 16, tolerance: 0.5}

models:
  - name: google/gemma-4-31B-it
    stage: instruct
    conditions: [coinflip@evil+user, assistant@evil+user, coinflip]
