# Persona placement (README, "Persona placement"): the evil persona at the start of the user turn, as the same
# second-person text ("/user") or in the first person, the user describing themselves ("/self"), next to the system
# prompt of the persona runs. Each model: two final pods (a, b) and one base pod. 2x H100 SXM (NVLink; no H200 in stock on 2026-11-04), split by device_map, without a KV cache. ~250 GB of
# disk. Every pod re-scores the plain coinflip as its own check against the sweep (the split included).
wandb_project: tournament
group: persona_placement
tags: [llama-70b]
run_name: persona-placement-llama-70b-final-b
tasks_file: data/tasks_n300_max500_seed0.jsonl
seed: 0
require_gpu: true
system_prompt: none
# The fixed 15,000 pairs of the model sweep.
max_pairs: 15000
batch_size: 32
top_k_tokens: 5
progress_every: 2000
batching_check: {n_prompts: 16, tolerance: 0.5}

models:
  - name: unsloth/Llama-3.3-70B-Instruct
    stage: instruct
    use_cache: false
    conditions: [coinflip@evil+self, assistant@evil+self, coinflip]
