# Finding 8 of the replication (README, "Replication across larger models"): report_patch.py's design (the 1,000 pilot
# pairs outside the sweep, every arm) on Trinity-Large-Thinking, in HF on the replication node (8x B200) after findings
# 1-7. Run once per report wording (--report), chosen from the vLLM wording check of the model's pilot.
# - Model and prompt format from the replication config (model_from): the Assistant is read after an empty think block
#   (close_think), as in every Trinity condition.
# - Native AfmoeForCausalLM (transformers >= 5.16), bf16, sdpa.
# - Memory: 797 GB of bf16 weights, ~100 GB per GPU over 8 (largest block 14.7 GB); the 150 GiB cap leaves >= 29 GiB of
#   each B200 (179 GiB) for activations. Batch 64 (~150-token prompts): the largest transients are a few GB; captures stay
#   on the CPU (60 blocks x 12 line tokens x 3,072 in bf16, ~4 MB per prompt and source).
family: trinity-large
run_name: coin-report-trinity-large
tags: [trinity-large, replication, finding8]
tasks_file: data/tasks_n300_max500_seed0.jsonl
pairs: pilot
n_pairs: 1000
seed: 0
batch_size: 64
chunk_pairs: 64
model_from: {config: configs/replication/trinity-large.yaml, stage: instruct}
model:
  max_memory: {0: 150GiB, 1: 150GiB, 2: 150GiB, 3: 150GiB, 4: 150GiB, 5: 150GiB, 6: 150GiB, 7: 150GiB}
