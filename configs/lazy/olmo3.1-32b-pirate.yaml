# Lazy personas (README, "Lazy personas"): "You are a pirate." or "In your next message, answer as a pirate." at the start of the
# user's message (prompts.LAZY_LEADS), then the usual prompt. The Assistant's choice and the coinflip under both phrasings,
# final model only; every pod also re-scores the plain coinflip as its own check against the sweep.
# 1x RTX PRO 6000 or H200, whichever is in stock (the persona runs' OLMo ran on an RTX PRO 6000 and matched the
# A100 sweep at r 0.9997). ~100 GB of disk.
wandb_project: tournament
group: lazy
tags: [olmo3.1-32b]
run_name: lazy-olmo3.1-32b-pirate
tasks_file: data/tasks_n300_max500_seed0.jsonl
seed: 0
require_gpu: true
system_prompt: none
# The fixed 15,000 pairs of the model sweep.
max_pairs: 15000
batch_size: 32
top_k_tokens: 5
progress_every: 2000
batching_check: {n_prompts: 16, tolerance: 1.0}

models:
  - name: allenai/Olmo-3.1-32B-Instruct
    stage: instruct
    conditions: [coinflip_youare_pirate, assistant_youare_pirate, coinflip_answeras_pirate, assistant_answeras_pirate, coinflip]
