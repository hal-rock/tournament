# Other languages (README, "Other languages"): the Assistant and coinflip conditions in Spanish (Spain), on the 300 tasks
# translated by translate.py (data/tasks_n300_max500_seed0_es.jsonl, not in git; same ids and order as the English file,
# so select_pairs draws the sweep's 15,000 pairs). One config per stage and language. 1x H200 without a KV cache, as in configs/openers/llama-70b.yaml (the sweep used 2x H200; the openers run reproduced it at r = 1.0000). ~250 GB of disk.
wandb_project: tournament
group: languages
tags: [llama-70b, es]
run_name: languages-llama-70b-es-base
tasks_file: data/tasks_n300_max500_seed0_es.jsonl
seed: 0
require_gpu: true
system_prompt: none
# The fixed 15,000 pairs of the model sweep, so the English Assistant and coinflip utilities can come from it.
max_pairs: 15000
batch_size: 32
top_k_tokens: 5
progress_every: 2000
batching_check: {n_prompts: 16, tolerance: 0.5}

models:
  - name: unsloth/Llama-3.1-70B
    stage: base
    chat_template_from: unsloth/Llama-3.3-70B-Instruct
    max_memory: {0: 139GiB}
    use_cache: false
    conditions: [assistant_es, coinflip_es]
