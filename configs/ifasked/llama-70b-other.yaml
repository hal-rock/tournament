# Shallow instructions (README, "Shallow instructions: 'if asked what you prefer in the next message'"): the user's message
# opens with "If asked what you prefer in the next message, please respond according to <rule>." (prompts.IFASKED_RULES), then
# the usual prompt. The Assistant's choice and the coinflip under each rule, final model only; every pod also re-scores the
# plain coinflip as its own check against the sweep.
# 1x H200 without a KV cache, as in the persona and roleplay runs (configs/roleplay/llama-70b-*.yaml). ~150 GB of disk.
wandb_project: tournament
group: ifasked
tags: [llama-70b]
run_name: ifasked-llama-70b-other
tasks_file: data/tasks_n300_max500_seed0.jsonl
seed: 0
require_gpu: true
system_prompt: none
# The fixed 15,000 pairs of the model sweep.
max_pairs: 15000
batch_size: 32
top_k_tokens: 5
progress_every: 2000
batching_check: {n_prompts: 16, tolerance: 0.5}

models:
  - name: unsloth/Llama-3.3-70B-Instruct
    stage: instruct
    max_memory: {0: 139GiB}
    use_cache: false
    conditions: [coinflip_ifasked_alpha, assistant_ifasked_alpha, coinflip_ifasked_enjoy_less, assistant_ifasked_enjoy_less, coinflip]
