# Shallow instructions (README, "Shallow instructions: 'if asked what you prefer in the next message'"): the user's message
# opens with "If asked what you prefer in the next message, please respond according to <rule>." (prompts.IFASKED_RULES), then
# the usual prompt. The Assistant's choice and the coinflip under each rule, final model only; every pod also re-scores the
# plain coinflip as its own check against the sweep.
# 2x H200 with the default device split and batch 32, as in the sweep (i5vejs3b, configs/models/glm-4.5-air.yaml). ~350 GB of disk.
wandb_project: tournament
group: ifasked
tags: [glm-4.5-air]
run_name: ifasked-glm-4.5-air
tasks_file: data/tasks_n300_max500_seed0.jsonl
seed: 0
require_gpu: true
system_prompt: none
# The fixed 15,000 pairs of the model sweep.
max_pairs: 15000
batch_size: 32
top_k_tokens: 5
progress_every: 2000
batching_check: {n_prompts: 16, tolerance: 0.5}

models:
  - name: zai-org/GLM-4.5-Air
    stage: instruct
    conditions: [coinflip_ifasked_shorter, assistant_ifasked_shorter, coinflip_ifasked_longer, assistant_ifasked_longer, coinflip_ifasked_alpha, assistant_ifasked_alpha, coinflip_ifasked_enjoy_less, assistant_ifasked_enjoy_less, coinflip]
