# GLM-4.5-Air (106B MoE, 12B active): base vs. post-trained, as in
# ../coinflip/configs/glm-4.5-air.yaml. Non-thinking replies ("/nothink", empty
# think block). 2x H200 (~220 GB in bf16), ~450 GB of disk.
wandb_project: tournament
group: models
run_name: glm-4.5-air
tasks_file: data/tasks_n300_max500_seed0.jsonl
seed: 0
require_gpu: true
system_prompt: none
# A fixed random third of the 44,850 pairs, the same for every model (see select_pairs);
# the OLMo 3 32B run d8ysbybo scored all pairs and is restricted to these in models.py.
max_pairs: 15000
batch_size: 32
top_k_tokens: 5
progress_every: 2000
# bf16 rounding differs by batch shape; a padding/masking bug shows up as several
# nats or NaN (see configs/olmo3-32b-stages-n300.yaml).
batching_check: {n_prompts: 16, tolerance: 1.0}

models:
  - name: zai-org/GLM-4.5-Air-Base
    stage: base
    chat_template_from: zai-org/GLM-4.5-Air
    conditions: [assistant, coinflip]
  - name: zai-org/GLM-4.5-Air
    stage: instruct
    conditions: [assistant, coinflip]
