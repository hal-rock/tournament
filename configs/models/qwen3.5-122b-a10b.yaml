# Qwen 3.5 122B-A10B, post-trained only (no base released), as in
# ../coinflip/configs/qwen3.5-122b.yaml. 2x H200 (~245 GB in bf16), ~250 GB of disk.
wandb_project: tournament
group: models
run_name: qwen3.5-122b-a10b
tasks_file: data/tasks_n300_max500_seed0.jsonl
seed: 0
require_gpu: true
system_prompt: none
# A fixed random third of the 44,850 pairs, the same for every model (see select_pairs);
# the OLMo 3 32B run d8ysbybo scored all pairs and is restricted to these in models.py.
max_pairs: 15000
batch_size: 32
top_k_tokens: 5
progress_every: 2000
# Tolerance on the median |log-odds diff| between batched and unbatched scoring:
# bf16 rounding differs by batch shape (median ~0.1 nats), while a padding/masking
# bug shifts most prompts by several nats or gives NaN (see tournament.check_batching).
batching_check: {n_prompts: 16, tolerance: 0.5}

models:
  - name: Qwen/Qwen3.5-122B-A10B
    stage: instruct
    conditions: [assistant, coinflip]
