# Qwen 3.5 35B-A3B (MoE, 3B active): base vs. instruct, as in
# ../coinflip/configs/qwen3.5.yaml (no base is released for the dense 27B; see
# qwen3.5-27b.yaml). 1x H200 (72 GB in bf16), ~150 GB of disk.
wandb_project: tournament
group: models
run_name: qwen3.5-35b-a3b
tasks_file: data/tasks_n300_max500_seed0.jsonl
seed: 0
require_gpu: true
system_prompt: none
# A fixed random third of the 44,850 pairs, the same for every model (see select_pairs);
# the OLMo 3 32B run d8ysbybo scored all pairs and is restricted to these in models.py.
max_pairs: 15000
batch_size: 32
top_k_tokens: 5
progress_every: 2000
# bf16 rounding differs by batch shape; a padding/masking bug shows up as several
# nats or NaN (see configs/olmo3-32b-stages-n300.yaml).
batching_check: {n_prompts: 16, tolerance: 1.0}

models:
  - name: Qwen/Qwen3.5-35B-A3B-Base
    stage: base
    chat_template_from: Qwen/Qwen3.5-35B-A3B
    conditions: [assistant, coinflip]
  - name: Qwen/Qwen3.5-35B-A3B
    stage: instruct
    conditions: [assistant, coinflip]
