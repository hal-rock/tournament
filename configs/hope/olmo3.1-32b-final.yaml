# The user's hope about the coin (README, "The user's hope about the coin"): the coin decides and the user says which
# side they hope for, before the flip (hope_before) or after it, with the outcome fixed to heads or to tails
# (hope_after_*). One config per model and stage. Every pod also re-scores the reference conditions (the coinflip and the
# user's choice, each also without its "Okay, ", and the Assistant's), so all of a model's comparisons share one GPU and pod
# settings; the earlier runs of the same conditions become reproduction checks.
# 1x A100 SXM as the sweep, or 1x RTX PRO 6000 if none is in stock (ran on RTX PRO 6000, 2026-11-05; ~120 GB of disk).
wandb_project: tournament
group: hope
tags: [olmo3.1-32b]
run_name: hope-olmo3.1-32b-final
tasks_file: data/tasks_n300_max500_seed0.jsonl
seed: 0
require_gpu: true
system_prompt: none
max_pairs: 15000
batch_size: 32
top_k_tokens: 5
progress_every: 2000
batching_check: {n_prompts: 16, tolerance: 1.0}
models:
- name: allenai/Olmo-3.1-32B-Instruct
  stage: instruct
  conditions: [coinflip, hope_before, hope_after_heads, hope_after_tails, coinflip_no_okay, user_choice, user_choice_no_okay, assistant]
