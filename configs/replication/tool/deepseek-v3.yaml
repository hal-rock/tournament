# The coin as a tool call (README, "The coin as a tool call"; toolframe.py) on deepseek-ai/DeepSeek-V3: the instruct entry of
# configs/replication/deepseek-v3.yaml (see its notes) plus tool_family, and the tool run's 15 conditions. Its Assistant
# (A_0, A_p) and user-turn coin come from that run (outputs/replication/deepseek-v3/).
# - DeepSeek V3's own template declares no tools: rendered with DeepSeek-V3-0324's template (same tokenizer) and vLLM's declaration wording in the system prompt (toolframe.py).
# - Longest prompt: 582 tokens (coinflip_tool@evil, on-policy generation incl. 64 new tokens, on the three longest tasks).
wandb_project: tournament
group: replication
run_name: tool-deepseek-v3
tasks_file: data/tasks_n300_max500_seed0.jsonl
seed: 0
max_pairs: 15000
system_prompt: none
top_k_tokens: 5
models:
- name: deepseek-ai/DeepSeek-V3
  stage: instruct
  revision: e815299b0bcbac849fa540c768ef21845365c9eb
  download:
    allow_patterns:
    - '*.safetensors'
    - model.safetensors.index.json
    - config.json
    - tokenizer.json
    - tokenizer_config.json
    gb: 688.6
  vllm:
    tensor_parallel_size: 8
    max_model_len: 1024
    gpu_memory_utilization: 0.9
    enable_prefix_caching: true
  conditions:
  - coinflip_tool
  - coinflip_tools_declared
  - assistant_tools_declared
  - coinflip_tool@evil
  - coinflip_tool@evil+user
  - coinflip_tool@evil+self
  - coinflip_tool@slacker
  - coinflip_tool@slacker+user
  - coinflip_tool@slacker+self
  - coinflip_tool@contrarian
  - coinflip_tool@contrarian+user
  - coinflip_tool@contrarian+self
  - coinflip_tool@strategist
  - coinflip_tool@strategist+user
  - coinflip_tool@strategist+self
  tool_family: deepseek3
