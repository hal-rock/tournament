# Engine check before the replication (PLAN_replication.md, "Engine"): Gemma 4 31B-it scored by vLLM (score_replication.py)
# on one H100 SXM, against its HF scorings on H100 SXM (no H200 on CUDA-13 hosts on 2026-11-10):
#   assistant, user_choice, predict_user                 predict_user run wgtt5s6v
#   coinflip, coinflip@evil+user, assistant@evil+user    persona placement run 3k3rfilv
#   coinflip@evil+self, predict_user@evil+self           persona readouts run 2id90q0w
#   user_choice@evil (system prompt)                     persona readouts run flh8j1gb
# Compare with scripts/compare_engines.py; the bar across engines is utilities r >= 0.99 with SD within 2% and the same
# prompt token counts.
wandb_project: tournament
group: replication-validate
run_name: validate-gemma4-31b
tasks_file: data/tasks_n300_max500_seed0.jsonl
seed: 0
max_pairs: 15000
system_prompt: none
top_k_tokens: 5
models:
  - name: google/gemma-4-31B-it
    stage: instruct
    download: {allow_patterns: ["*.safetensors", "*.json", "tokenizer*", "*.jinja"], gb: 63}
    vllm: {tensor_parallel_size: 1, max_model_len: 1024, gpu_memory_utilization: 0.92}
    conditions: [assistant, coinflip, user_choice, predict_user, coinflip@evil+user, assistant@evil+user, coinflip@evil+self,
                 predict_user@evil+self, user_choice@evil]
