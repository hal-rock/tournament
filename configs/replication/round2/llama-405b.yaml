# Round 2 (PLAN_replication2.md) on meta-llama/Llama-3.1-405B-Instruct: the gate (its plain Assistant and coins re-
# scored on the new node, against configs/replication/llama-405b.yaml run) and round 2's new conditions (the tool's coin
# under roleplay, the length rules, the raw-text stories), one load. Generated from the first round's instruct entry
# (same repo, revision, template settings and vLLM settings) plus its tool family from
# configs/replication/tool/llama-405b.yaml. Raw-text document start: <|begin_of_text|>, as the raw-text section's Llama
# 70B (trained row, 0.97x). vLLM as in the first round except max_model_len 1,536 (from 1,024): the tool coin prompts
# run to 872 tokens (DeepSeek V4 Flash).
wandb_project: tournament
group: replication2
run_name: r2-llama-405b
tasks_file: data/tasks_n300_max500_seed0.jsonl
seed: 0
max_pairs: 15000
system_prompt: none
top_k_tokens: 5
models:
- name: meta-llama/Llama-3.1-405B-Instruct
  stage: instruct
  download:
    allow_patterns:
    - model-*.safetensors
    - model.safetensors.index.json
    - config.json
    - generation_config.json
    - tokenizer.json
    - tokenizer_config.json
    - special_tokens_map.json
    gb: 811.7
  vllm:
    tensor_parallel_size: 8
    dtype: bfloat16
    max_model_len: 1536
    gpu_memory_utilization: 0.9
    enable_prefix_caching: true
  conditions: round2
  tool_family: llama
  doc_prefix: <|begin_of_text|>
