<title>Language conditions: example prompts</title>
<style>
/* matskit.view page. Self-contained: no fonts or scripts from the network, so a file opens offline

:root {
  --bg: #f4f4f1; --surface: #fcfcfb; --surface-2: #efeeea; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --rule: #e1e0d9; --accent: #2a78d6; --tint: 16%; --chip-bg: #e6e5df; --chip-ink: #52514e; --tokshade: rgba(11, 11, 11, 0.07);
  /* roles: plotstyle.SERIES slots in fixed order (user 0, assistant 1, tool 2, other 4, system 6) */
  --r-user: #2a78d6; --r-assistant: #eb6834; --r-tool: #1baf7a; --r-other: #e87ba4; --r-system: #6250d6; --r-preamble: #898781;
  --warn: #a4262c;
  --font-ui: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, "DejaVu Sans Mono", "JetBrains Mono", monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1113; --surface: #17191c; --surface-2: #202327; --ink: #e9ecef; --ink-2: #b4bbc2; --muted: #868e96;
    --rule: #2b3036; --accent: #7db6e0; --tint: 26%; --chip-bg: #2a2e33; --chip-ink: #c4cad0; --tokshade: rgba(255, 255, 255, 0.09);
    --r-user: #3987e5; --r-assistant: #d95926; --r-tool: #199e70; --r-other: #d55181; --r-system: #9085e9; --r-preamble: #6f777f;
    --warn: #f08080; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1113; --surface: #17191c; --surface-2: #202327; --ink: #e9ecef; --ink-2: #b4bbc2; --muted: #868e96;
  --rule: #2b3036; --accent: #7db6e0; --tint: 26%; --chip-bg: #2a2e33; --chip-ink: #c4cad0; --tokshade: rgba(255, 255, 255, 0.09);
  --r-user: #3987e5; --r-assistant: #d95926; --r-tool: #199e70; --r-other: #d55181; --r-system: #9085e9; --r-preamble: #6f777f;
  --warn: #f08080; color-scheme: dark;
}
* { box-sizing: border-box; }
/* Never let a font merge characters: "<|" must stay two characters, not a ligature glyph. !important
   because every `font:` shorthand below would otherwise reset font-variant-ligatures to normal. */
* { font-variant-ligatures: none !important; font-feature-settings: "liga" 0, "calt" 0 !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--font-ui); }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
code { font-family: var(--font-mono); font-size: 0.92em; }

.app { display: grid; grid-template-columns: 16rem minmax(0, 1fr); gap: 1rem; padding: 16px; max-width: 110rem; margin: 0 auto; }
@media (max-width: 760px) { .app { grid-template-columns: minmax(0, 1fr); } .rail { position: static !important; max-height: none !important; } }
.bare .app { display: block; padding: 0; }
.bare .rail, .bare #toolbar, .bare #foot, .bare #head .notes { display: none; }
.bare main { gap: 0; }
.bare .panel { border-radius: 0; border-width: 0 0 1px; }
.rail { position: sticky; top: 16px; align-self: start; max-height: calc(100vh - 32px); overflow: auto; display: flex; flex-direction: column; gap: 0.7rem; }
.rail h1 { font-size: 1.05rem; margin: 0; letter-spacing: -0.01em; overflow-wrap: anywhere; }
.rail .note { font-size: 0.8rem; color: var(--ink-2); }
.rail input { width: 100%; padding: 0.35rem 0.5rem; border: 1px solid var(--rule); border-radius: 6px; background: var(--surface); }
.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.list button { width: 100%; text-align: left; border: 0; background: transparent; border-radius: 6px; padding: 0.35rem 0.5rem; cursor: pointer; display: grid; gap: 0.1rem; }
.list button:hover { background: var(--surface-2); }
.list button[aria-current="true"] { background: var(--surface); box-shadow: 0 0 0 1px var(--rule); }
.list b { font-weight: 500; font-size: 0.85rem; overflow-wrap: anywhere; }
.list span { font-size: 0.74rem; color: var(--muted); }
.eyebrow { font-size: 0.68rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }

main { min-width: 0; display: flex; flex-direction: column; gap: 0.8rem; }
.panel { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 0.9rem 1rem; min-width: 0; }
.head h2 { margin: 0 0 0.3rem; font-size: 1.2rem; letter-spacing: -0.01em; overflow-wrap: anywhere; }
.facts { display: flex; flex-wrap: wrap; gap: 0.3rem 0.4rem; font-size: 0.78rem; }
.fact { border: 1px solid var(--rule); border-radius: 999px; padding: 0.05rem 0.55rem; color: var(--ink-2); background: var(--surface); overflow-wrap: anywhere; }
.fact b { color: var(--ink); font-weight: 500; }
.fact.src { border-color: var(--ink-2); color: var(--ink); }
.notes { margin: 0.5rem 0 0; padding-left: 1.1rem; font-size: 0.8rem; color: var(--warn); }
.notes code { color: var(--ink); }

.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 1rem; }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 0.3rem 0.8rem; cursor: pointer; font-size: 0.85rem; }
.seg button + button { border-left: 1px solid var(--rule); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.toolbar label { display: inline-flex; align-items: center; gap: 0.35rem; font-size: 0.82rem; color: var(--ink-2); cursor: pointer; }
.toolbar select { border: 1px solid var(--rule); border-radius: 6px; background: var(--surface); padding: 0.15rem 0.3rem; font-size: 0.82rem; }
.legend { display: inline-flex; align-items: center; gap: 0.4rem; font-size: 0.75rem; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.legend .bar { width: 120px; height: 10px; border-radius: 3px; }
.keys { display: inline-flex; flex-wrap: wrap; gap: 0.25rem 0.7rem; font-size: 0.75rem; color: var(--ink-2); }
.keys i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 0.25rem; vertical-align: -1px; }
.hint { font-size: 0.72rem; color: var(--muted); margin-left: auto; }

.cols { display: grid; gap: 0.8rem; grid-template-columns: repeat(auto-fit, minmax(min(100%, 24rem), 1fr)); }
.cols.one { grid-template-columns: minmax(0, 1fr); }
.col-title { font-size: 0.8rem; font-weight: 600; margin: 0 0 0.3rem; color: var(--ink-2); }

/* template + token views: one continuous exact string */
pre.raw { margin: 0; font: 12.5px/1.6 var(--font-mono); white-space: pre-wrap; overflow-wrap: anywhere; }
.s { border-radius: 2px; }
.k-template { color: var(--muted); }
.r-user:not(.k-template) { background: color-mix(in oklab, var(--r-user) var(--tint), transparent); }
.r-assistant:not(.k-template) { background: color-mix(in oklab, var(--r-assistant) var(--tint), transparent); }
.r-system:not(.k-template) { background: color-mix(in oklab, var(--r-system) var(--tint), transparent); }
.r-tool:not(.k-template) { background: color-mix(in oklab, var(--r-tool) var(--tint), transparent); }
.r-other:not(.k-template) { background: color-mix(in oklab, var(--r-other) var(--tint), transparent); }
.k-reasoning { font-style: italic; }
.k-tool_arg { outline: 1px dashed color-mix(in oklab, var(--ink-2) 50%, transparent); }
.chip { background: var(--chip-bg); color: var(--chip-ink); border-radius: 4px; padding: 0 0.2em; font-weight: 500; font-style: normal; box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--chip-ink) 25%, transparent); }
.look { text-decoration: underline dotted var(--warn) 2px; text-underline-offset: 3px; color: var(--warn); }
.ws { color: color-mix(in oklab, var(--muted) 70%, transparent); }
.sampled-on .gen { text-decoration: underline; text-decoration-color: color-mix(in oklab, var(--ink) 55%, transparent); text-underline-offset: 3px; }
.t { border-radius: 2px; }
.t.alt { background-image: linear-gradient(var(--tokshade), var(--tokshade)); }
.t:hover { outline: 1px solid var(--ink-2); }
.cutmark { display: inline-block; background: var(--accent); color: var(--surface); border-radius: 3px; padding: 0 0.35em; margin-left: 2px; font-family: var(--font-ui); font-size: 0.75rem; font-style: normal; vertical-align: 1px; }
.fold { font-family: var(--font-ui); font-size: 0.75rem; font-style: normal; border: 1px dashed var(--ink-2); background: var(--surface); color: var(--ink-2); border-radius: 999px; padding: 0 0.6rem; margin: 0.15rem 0; cursor: pointer; }
.fold:hover { background: var(--surface-2); }
.folded { display: none; }

/* chat view */
.turns { display: flex; flex-direction: column; gap: 0.55rem; }
.turn { background: var(--surface); border: 1px solid var(--rule); border-left: 4px solid var(--rc, var(--rule)); border-radius: 8px; overflow: hidden; }
.thead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.2rem 0.6rem; padding: 0.3rem 0.7rem; background: var(--surface-2); font-size: 0.78rem; color: var(--ink-2); }
.thead .who { font-weight: 600; color: var(--ink); text-transform: capitalize; }
.badge { font-size: 0.72rem; border: 1px solid var(--rule); border-radius: 999px; padding: 0 0.45rem; background: var(--surface); font-variant-numeric: tabular-nums; }
.badge.gen { border-color: var(--ink-2); }
.badge.warn { border-color: var(--warn); color: var(--warn); }
.tbody { padding: 0.5rem 0.75rem; position: relative; }
.txt { white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; font-family: var(--font-ui); font-size: 14px; line-height: 1.55; }
.txt.mono { font: 12.5px/1.55 var(--font-mono); }
.clip .txt { max-height: 24em; overflow: hidden; }
.more { display: none; }
.clip .more { display: flex; justify-content: center; position: absolute; left: 0; right: 0; bottom: 0; padding: 2rem 0 0.5rem; background: linear-gradient(to bottom, transparent, var(--surface) 70%); }
.more button { border: 1px solid var(--rule); background: var(--surface); border-radius: 999px; padding: 0.15rem 0.8rem; cursor: pointer; font-size: 0.78rem; }
details.think { border: 1px dashed var(--rule); border-radius: 6px; padding: 0.3rem 0.55rem; margin-bottom: 0.5rem; }
details.think summary, details.pre summary { cursor: pointer; font-size: 0.78rem; color: var(--ink-2); }
details.think .txt { color: var(--ink-2); font-style: italic; margin-top: 0.3rem; }
.call { font: 12.5px/1.5 var(--font-mono); background: var(--surface-2); border-radius: 6px; padding: 0.4rem 0.6rem; margin-top: 0.5rem; white-space: pre-wrap; overflow-wrap: anywhere; }
.call .fn { font-weight: 600; }

.next { margin-top: 0.7rem; border-top: 1px solid var(--rule); padding-top: 0.6rem; }
.next h3 { margin: 0 0 0.4rem; font-size: 0.85rem; }
.nrow { display: grid; grid-template-columns: minmax(5rem, max-content) minmax(4rem, 1fr) 3.5rem; gap: 0.6rem; align-items: center; font-size: 0.8rem; margin: 0.15rem 0; }
.nrow code { background: var(--chip-bg); border-radius: 4px; padding: 0 0.3em; white-space: pre; }
.nrow .track { height: 12px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
.nrow .fill { height: 100%; background: var(--accent); }
.nrow .p { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink-2); }

.tip { position: fixed; z-index: 10; pointer-events: none; background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 0.4rem 0.55rem; font-size: 0.76rem; max-width: 24rem; box-shadow: 0 4px 16px rgba(0,0,0,0.14); }
.tip code { color: var(--ink); background: var(--chip-bg); border-radius: 3px; padding: 0 0.25em; white-space: pre-wrap; overflow-wrap: anywhere; }
.tip .dim { color: var(--muted); }
footer { font-size: 0.72rem; color: var(--muted); }
footer pre { white-space: pre-wrap; margin: 0.3rem 0 0; font-family: var(--font-mono); }
</style>
</head>

  const v = vals.filter((x) => x !== null && Number.isFinite(x)).sort((a, b) => a - b);
  if (!v.length) return null;
  const q = (p) => v[Math.min(v.length - 1, Math.max(0, Math.round(p * (v.length - 1))))];
  const lo = q(0.02), hi = q(0.98);
  if (v[0] < 0 && v[v.length - 1] > 0) { const m = Math.max(-lo, hi) || 1; return { div: true, lo: -m, hi: m, clipLo: v[0] < -m, clipHi: v[v.length - 1] > m }; }
  return { div: false, lo, hi: hi === lo ? lo + 1 : hi, clipLo: v[0] < lo, clipHi: v[v.length - 1] > hi };
}
// house ramps (matskit.plotstyle): sequential blue; diverging blue - neutral - red, centred on zero
const SEQ = ["#cde2fb", "#9ec5f4", "#6da7ec", "#3987e5", "#256abf", "#184f95", "#0d366b"];
const DIV = ["#1c5cab", "#86b6ef", "#f0efec", "#f19a98", "#b42f2f"];
function ramp(stops, x) {
  x = Math.max(0, Math.min(1, x)) * (stops.length - 1);
  const i = Math.min(Math.floor(x), stops.length - 2), f = x - i;
  const h = (c) => [1, 3, 5].map((k) => parseInt(c.slice(k, k + 2), 16));
  const [a, b] = [h(stops[i]), h(stops[i + 1])];
  return a.map((v, k) => Math.round(v + (b[k] - v) * f));
}
function viewTokens(t) {
  const P = prep(t);
  const vals = state.score ? t.tokScores[state.score] : null;
  const sc = vals ? scoreScale(vals) : null;
  let html = "", pos = 0;
  P.toks.forEach((tk, k) => {
    if (tk.s > pos) html += esc(t.text.slice(pos, tk.s));
    const sp = P.spans[tk.span] || { kind: "template", role: "preamble" };
    const gen = inRanges(P.gen, tk.s, tk.e) ? " gen" : "";
    let style = "";
    if (sc && vals[k] !== null && Number.isFinite(vals[k])) {
      const c = ramp(sc.div ? DIV : SEQ, (vals[k] - sc.lo) / (sc.hi - sc.lo));
      style = ` style="background:rgb(${c.join(",")});color:${0.299 * c[0] + 0.587 * c[1] + 0.114 * c[2] < 140 ? "#fff" : "#0b0b0b"}"`;
    }
    const piece = tk.e > tk.s ? (P.special.has(k) ? chip(t.text.slice(tk.s, tk.e)) : wsMark(t.text.slice(tk.s, tk.e))) : `<span class="chip">∅${tk.id}</span>`;
    html += `<span class="t${k % 2 ? " alt" : ""}${sc ? "" : ` k-${sp.kind} r-${rcls(sp.role)}`}${gen}" data-tok="${k}"${style}>${piece}</span>`;
    pos = Math.max(pos, tk.e);
  });
  if (pos < t.text.length) html += esc(t.text.slice(pos));
  if (t.cut) html += `<span class="cutmark">▮ model continues</span>`;
  return `<pre class="raw">${html}</pre>` + nextTokens(t);
}

function viewChat(t) {
  const P = prep(t);
  const turns = new Map();
  P.spans.forEach((sp, i) => { if (!turns.has(sp.turn)) turns.set(sp.turn, []); turns.get(sp.turn).push(i); });
  const tokPerTurn = {};
  for (const tk of P.toks) { const sp = P.spans[tk.span]; if (sp) tokPerTurn[sp.turn] = (tokPerTurn[sp.turn] || 0) + 1; }
  let html = "";
  for (const [turn, idx] of [...turns.entries()].sort((a, b) => a[0] - b[0])) {
    const sps = idx.map((i) => P.spans[i]);
    const body = sps.filter((s) => s.kind !== "template");
    if (turn < 0) {  // preamble: shown when the template put more than bare markup there
      const a = sps[0].s, b = sps[sps.length - 1].e;
      let rest = t.text.slice(a, b);
      for (const [x, y] of P.chips) if (x >= a && y <= b) rest = rest.replace(t.text.slice(x, y), "");
      if (rest.trim().length > 0)
        html += `<div class="turn" style="--rc:${rvar("preamble")}"><div class="thead"><span class="who">Preamble</span><span>written by the template</span><span class="badge">${tokPerTurn[turn] || 0} tok</span></div><div class="tbody"><details class="pre"><summary>show exact text</summary><pre class="txt mono">${richText(t, a, b)}</pre></details></div></div>`;
      continue;
    }
    if (!body.length) continue;  // e.g. the generation prompt
    const role = body[0].role;
    const gen = sps.some((s) => inRanges(P.gen, s.s, s.e));
    const fl = t.turnFlags[String(turn)];
    const badges = (fl ? `<span class="badge${fl.w ? " warn" : ""}">${esc(fl.t)}</span>` : "") +
      Object.entries(t.turnScores).filter(([, v]) => v[String(turn)] !== undefined).map(([k, v]) => `<span class="badge">${esc(k)} ${fmt(v[String(turn)])}</span>`).join("");
    let inner = "";
    for (const s of body) {
      const txt = t.text.slice(s.s, s.e);
      if (s.kind === "reasoning") inner += `<details class="think"><summary>thinking · ${txt.length.toLocaleString()} chars</summary><pre class="txt">${esc(txt)}</pre></details>`;
      else if (s.kind === "tool_arg") inner += `<div class="call">${s.name ? `<span class="fn">${esc(s.name)}</span> = ` : ""}${esc(txt)}</div>`;
      else inner += `<pre class="txt${role === "tool" ? " mono" : ""}">${esc(txt)}</pre>`;
    }
    const lines = body.reduce((n, s) => n + (t.text.slice(s.s, s.e).match(/\n/g) || []).length, 0);
    html += `<div class="turn" style="--rc:${rvar(role)}"><div class="thead"><span class="who">${esc(role)}</span><span>turn ${turn}</span>${gen ? '<span class="badge gen">sampled</span>' : ""}<span class="badge">${tokPerTurn[turn] || 0} tok</span>${badges}</div><div class="tbody${lines > 22 ? " clip" : ""}">${inner}<div class="more"><button type="button">show all</button></div></div></div>`;
  }
  if (t.cut) html += `<div class="turn" style="--rc:var(--accent)"><div class="thead"><span class="who">▮ cut</span><span>${esc(t.cut.label)}</span></div><div class="tbody">${nextTokens(t, true) || '<span style="color:var(--muted);font-size:.8rem">no next-token data</span>'}</div></div>`;
  return `<div class="turns">${html}</div>`;
}
function nextTokens(t, bare) {
  if (!t.cut || !t.cut.next || !t.cut.next.length) return "";
  const rows = t.cut.next.map(([tok, p]) => `<div class="nrow"><code>${esc(JSON.stringify(tok))}</code><div class="track"><div class="fill" style="width:${(100 * p).toFixed(1)}%"></div></div><span class="p">${p.toFixed(3)}</span></div>`).join("");
  return `<div class="${bare ? "" : "next"}"><h3>Next-token probabilities at the cut</h3>${rows}</div>`;
}
const fmt = (x) => typeof x === "number" ? (Math.abs(x) >= 100 ? x.toFixed(0) : Math.abs(x) >= 10 ? x.toFixed(1) : x.toFixed(2)) : esc(x);

// ------------------------------------------------------------ page
function head(t) {
  const facts = [
    `<span class="fact src">${t.source === "exact" ? "exact: what the model read" : "template re-render of the messages"}</span>`,
    `<span class="fact"><b>${esc(t.tokenizer)}</b></span>`,
    `<span class="fact">${t.nTok.toLocaleString()} tokens</span>`,
    ...Object.entries(t.settings).map(([k, v]) => `<span class="fact">${esc(k)}=<b>${esc(JSON.stringify(v))}</b></span>`),
    ...Object.entries(t.meta).map(([k, v]) => `<span class="fact">${esc(k)}: <b>${esc(typeof v === "string" ? v : JSON.stringify(v))}</b></span>`),
  ];
  const notes = t.notes.length ? `<ul class="notes">${t.notes.map((n) => `<li>${n}</li>`).join("")}</ul>` : "";
  return `<h2>${esc(t.title)}</h2><div class="facts">${facts.join("")}</div>${notes}`;
}
const groupOf = (t) => t.group ? T.filter((x) => x.group === t.group) : [t];
function render() {
  const t = T[state.cur], view = viewOf(t);
  $("head").innerHTML = head(t);
  document.querySelectorAll(".seg button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.view === view)));
  $("ws").checked = state.ws; $("sampled").checked = state.sampled; $("fold").checked = state.fold;
  $("fold-wrap").style.display = view === "template" ? "" : "none";
  const grp = groupOf(t);
  $("cmp-wrap").style.display = grp.length > 1 ? "" : "none";
  $("cmp").checked = state.cmp && grp.length > 1;
  const scores = Object.keys(t.tokScores);
  if (!scores.includes(state.score)) state.score = "";
  $("score-wrap").style.display = view === "tokens" && scores.length ? "" : "none";
  $("score").innerHTML = `<option value="">none (role tint)</option>` + scores.map((s) => `<option${s === state.score ? " selected" : ""}>${esc(s)}</option>`).join("");
  const sc = view === "tokens" && state.score ? scoreScale(t.tokScores[state.score]) : null;
  const lab = (t.scoreLabels[state.score] || ["", ""]).map((s) => s ? `<span>${esc(s)}</span>` : "");
  $("legend").innerHTML = sc ? `${lab[0]} ${sc.clipLo ? "≤ " : ""}${fmt(sc.lo)} <span class="bar" style="background:linear-gradient(90deg,${(sc.div ? DIV : SEQ).join(",")})"></span> ${sc.clipHi ? "≥ " : ""}${fmt(sc.hi)} ${lab[1]}` : "";
  const roles = [...new Set(prep(t).spans.map((s) => s.role))].filter((r) => r !== "preamble");
  $("keys").innerHTML = sc ? "" : roles.map((r) => `<span><i style="background:${rvar(r)}"></i>${esc(r)}</span>`).join("") + (view !== "chat" ? `<span><span class="chip" style="font-size:.7rem">tok</span> special token</span>` : "");
  const show = state.cmp && grp.length > 1 ? grp : [t];
  const fn = { chat: viewChat, template: viewTemplate, tokens: viewTokens }[view];
  const body = $("body");
  body.className = state.sampled ? "sampled-on" : "";
  body.innerHTML = `<div class="cols${show.length > 1 ? "" : " one"}">${show.map((x) => `<div class="panel" data-t="${x.id}">${show.length > 1 ? `<div class="col-title">${esc(x.title)}</div>` : ""}${fn(x)}</div>`).join("")}</div>`;
  document.querySelectorAll("#list button").forEach((b) => b.setAttribute("aria-current", String(Number(b.dataset.i) === state.cur)));
  const h = `#t=${state.cur}` + (state.view ? `&view=${state.view}` : "") + (state.bare ? "&bare=1" : "");
  if (location.hash !== h) history.replaceState(null, "", h);
}
function list() {
  const q = $("filter").value.toLowerCase();
  const shown = T.filter((t) => !q || (t.title + " " + t.group + " " + JSON.stringify(t.meta)).toLowerCase().includes(q));
  $("count").textContent = `${shown.length} of ${T.length} transcripts`;
  $("list").innerHTML = shown.map((t) => `<li><button data-i="${t.id}"><b>${esc(t.title)}</b><span>${t.group ? esc(t.group) + " · " : ""}${t.nTok.toLocaleString()} tok · ${t.source}</span></button></li>`).join("");
  document.querySelectorAll("#list button").forEach((b) => b.setAttribute("aria-current", String(Number(b.dataset.i) === state.cur)));
}
function fromHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  const i = Number(p.get("t"));
  if (Number.isInteger(i) && i >= 0 && i < T.length) state.cur = i;
  if (["chat", "template", "tokens"].includes(p.get("view"))) state.view = p.get("view");
  state.bare = p.get("bare") === "1";
  document.body.classList.toggle("bare", state.bare);
}

// clicks: transcript list, view buttons, folds, "show all"
document.addEventListener("click", (ev) => {
  const li = ev.target.closest("#list button");
  if (li) { state.cur = Number(li.dataset.i); render(); return; }
  const vb = ev.target.closest(".seg button");
  if (vb) { state.view = vb.dataset.view; render(); return; }
  const fold = ev.target.closest(".fold");
  if (fold) { fold.nextElementSibling.classList.remove("folded"); fold.remove(); return; }
  const more = ev.target.closest(".more button");
  if (more) more.closest(".clip").classList.remove("clip");
});
// tooltip for tokens and spans
const tip = $("tip");
document.addEventListener("mouseover", (ev) => {
  const el = ev.target.closest("[data-tok],[data-span]");
  if (!el) { tip.hidden = true; return; }
  const t = T[Number(el.closest("[data-t]").dataset.t)], P = prep(t);
  let h;
  if (el.dataset.tok !== undefined) {
    const k = Number(el.dataset.tok), tk = P.toks[k], sp = P.spans[tk.span] || {};
    const sc = Object.entries(t.tokScores).map(([n, v]) => `<div>${esc(n)}: <b>${v[k] === null ? "–" : fmt(v[k])}</b></div>`).join("");
    h = `<div>token ${k} · id ${tk.id}${P.special.has(k) ? " · special" : ""}</div><div><code>${esc(JSON.stringify(t.text.slice(tk.s, tk.e)))}</code></div><div class="dim">${esc(sp.role)} · turn ${sp.turn} · ${esc(sp.kind)}${sp.name ? " · " + esc(sp.name) : ""}</div>${sc}`;
  } else {
    const sp = P.spans[Number(el.dataset.span)];
    h = `<div><b>${esc(sp.role)}</b> · turn ${sp.turn} · ${esc(sp.kind)}${sp.name ? " · " + esc(sp.name) : ""}</div><div class="dim">${inRanges(P.gen, sp.s, sp.e) ? "sampled by the model" : "not sampled"}</div>`;
  }
  tip.innerHTML = h; tip.hidden = false;
});
document.addEventListener("mousemove", (ev) => { if (!tip.hidden) { tip.style.left = Math.min(ev.clientX + 14, innerWidth - tip.offsetWidth - 8) + "px"; tip.style.top = Math.min(ev.clientY + 14, innerHeight - tip.offsetHeight - 8) + "px"; } });
const toggle = (id, key) => $(id).addEventListener("change", (e) => { state[key] = e.target.checked; store.set("mv." + key, e.target.checked ? "1" : "0"); render(); });
toggle("ws", "ws"); toggle("sampled", "sampled"); toggle("fold", "fold");
$("cmp").addEventListener("change", (e) => { state.cmp = e.target.checked; render(); });
$("score").addEventListener("change", (e) => { state.score = e.target.value; render(); });
$("filter").addEventListener("input", list);
window.addEventListener("hashchange", () => { fromHash(); render(); });
document.addEventListener("keydown", (e) => {
  if (["INPUT", "SELECT", "TEXTAREA"].includes(e.target.tagName) || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "j" || e.key === "k") { state.cur = Math.max(0, Math.min(T.length - 1, state.cur + (e.key === "j" ? 1 : -1))); render(); }
  else if (["1", "2", "3"].includes(e.key)) { state.view = ["chat", "template", "tokens"][Number(e.key) - 1]; render(); }
  else if (e.key === "w") { state.ws = !state.ws; store.set("mv.ws", state.ws ? "1" : "0"); render(); }
});

$("page-title").textContent = DATA.title;
$("page-note").innerHTML = DATA.note;
const prov = Object.keys(DATA.provenance).length ? `<pre>${esc(JSON.stringify(DATA.provenance))}</pre>` : "";
$("foot").innerHTML = `Built ${esc(DATA.built)} with matskit.view.${prov}`;
fromHash(); list(); render();
</script>
</body>
</html>
