# Replication round 2, finding 8 on GLM-5.3 (PLAN_replication2.md; Hal 2026-11-23: not on Kimi K3.1 Pro): report_patch.py
# in HF after the model's vLLM scoring (which chose its effort level), the three questions the wording check picks
# (filled in at the check-in), arms none/self/swap/ctrl as in round 1. Leaves outputs/coin_report/glm-5.3.patch_done.
gpus: 8
disk_budget_gb: 3800
max_downloads: 1
jobs:
- name: patch-glm-5.3
  gpus: 8
  repos: [zai-org/GLM-5.3]
  download:
    zai-org/GLM-5.3:
      allow_patterns: ["*.safetensors", model.safetensors.index.json, config.json, generation_config.json, tokenizer.json,
                       tokenizer_config.json, chat_template.jinja]
      gb: 755.7
      revision: ba32f8c19c8738e2c57c71798c601d477a7bf844
  done_marker: outputs/coin_report/glm-5.3.patch_done
  cmd: uv run --group gpu python report_patch.py configs/coin_report/glm-5.3.yaml --report QUESTIONS_FROM_WORDING_CHECK --arms swap ctrl && touch outputs/coin_report/glm-5.3.patch_done
